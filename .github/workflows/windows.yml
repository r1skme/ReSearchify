name: Build, test and publish previews

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ripgrep comparison is available
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            choco install ripgrep --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          rg --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DRESEARCHIFY_STATIC_RUNTIME=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test measurement harness
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Benchmark smoke (not a performance gate)
        shell: pwsh
        run: |
          ./build/Release/cs_bench.exe --work perf-smoke --phase generate --files 64 --lines 12
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/Release/cs_bench.exe --work perf-smoke --phase create --threads 2 --memory-mb 64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/Release/cs_bench.exe --work perf-smoke --phase search --memory-mb 64 --repeats 3 --stages 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/Release/cs_bench.exe --work perf-smoke --phase create --index fast --profile fast --threads 2 --memory-mb 64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/Release/cs_bench.exe --work perf-smoke --phase search --index fast --memory-mb 64 --repeats 3 --stages 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/perf_benchmark.py --executable build/Release/rs.exe --index perf-smoke/index --corpus perf-smoke/source --iterations 3 --memory-mb 64 --query literal --query broad_regex --query no_match --rg rg --output perf-smoke/measurements.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: perf-windows-x64
          path: perf-smoke/measurements.json
      - name: Check whether tiny-file timing inputs changed
        id: tiny_perf
        shell: bash
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rerun=true
          if [[ "$PREVIOUS_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            if git fetch --no-tags --depth=1 origin "$PREVIOUS_HEAD"; then
              if git diff --quiet "$PREVIOUS_HEAD" HEAD -- src include tests CMakeLists.txt cmake scripts .github/workflows bench ':(exclude)bench/results/**'; then
                rerun=false
              fi
            fi
          fi
          echo "run=$rerun" >> "$GITHUB_OUTPUT"
      - name: Check out original Windows performance baseline
        if: steps.tiny_perf.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: eb858348169157686e70104af6b64f9539a39fe8
          path: native-baselines/original
          persist-credentials: false
      - name: Build original native Windows comparison binary
        if: steps.tiny_perf.outputs.run == 'true'
        shell: pwsh
        run: |
          cmake -S native-baselines/original -B native-baselines/original/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF -DRESEARCHIFY_STATIC_RUNTIME=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native-baselines/original/build --target researchify --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native 100k tiny-file comparison (correctness gate only)
        if: steps.tiny_perf.outputs.run == 'true'
        timeout-minutes: 70
        shell: pwsh
        run: |
          $baselineRevision = git -C native-baselines/original rev-parse HEAD
          if ($LASTEXITCODE -or $baselineRevision -ne 'eb858348169157686e70104af6b64f9539a39fe8') { throw 'Wrong baseline source revision' }
          $currentRevision = git rev-parse HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tiny_comparison.py --baseline native-baselines/original/build/Release/rs.exe --current build/Release/rs.exe --baseline-revision $baselineRevision --current-revision $currentRevision --files 100000 --iterations 21 --session-iterations 1000 --update-iterations 7 --index-threads 4 --rg rg --work tiny-native-perf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve Windows tiny-file evidence, including incomplete runs
        if: always() && steps.tiny_perf.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-windows-tiny-x64
          path: tiny-native-perf/results/
          if-no-files-found: warn
      - name: Quick start check
        shell: pwsh
        run: |
          .\build\Release\rs.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\build\Release\rs.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item build/Release/rs.exe dist/package/rs.exe
          Copy-Item README.md, README.ru.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/ReSearchify-Windows-x64.zip -Force
          if (!(Test-Path dist/ReSearchify-Windows-x64.zip)) { throw 'Portable archive missing' }
          Expand-Archive -Path dist/ReSearchify-Windows-x64.zip -DestinationPath dist/verify
          $binaryBytes = [System.IO.File]::ReadAllBytes((Resolve-Path dist/verify/rs.exe))
          $peOffset = [System.BitConverter]::ToInt32($binaryBytes, 0x3c)
          if ([System.BitConverter]::ToUInt16($binaryBytes, $peOffset + 4) -ne 0x8664) {
            throw 'Packaged executable is not Windows x86-64'
          }
          .\dist\verify\rs.exe --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-windows-portable
          path: dist/ReSearchify-Windows-x64.zip
          if-no-files-found: error


  linux:
    name: Linux ${{ matrix.arch }} (GCC)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            machine: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ripgrep comparison is available
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test measurement harness
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Benchmark smoke (not a performance gate)
        run: |
          ./build/cs_bench --work perf-smoke --phase generate --files 64 --lines 12
          ./build/cs_bench --work perf-smoke --phase create --threads 2 --memory-mb 64
          ./build/cs_bench --work perf-smoke --phase search --memory-mb 64 --repeats 3 --stages 1
          ./build/cs_bench --work perf-smoke --phase create --index fast --profile fast --threads 2 --memory-mb 64
          ./build/cs_bench --work perf-smoke --phase search --index fast --memory-mb 64 --repeats 3 --stages 1
          python scripts/perf_benchmark.py --executable build/rs --index perf-smoke/index --corpus perf-smoke/source --iterations 3 --memory-mb 64 --query literal --query broad_regex --query no_match --rg rg --output perf-smoke/measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: perf-linux-${{ matrix.arch }}
          path: perf-smoke/measurements.json
      - name: Verify architecture, smoke-test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          ./build/rs --help
          ./build/rs --version
          mkdir -p dist/package dist/verify
          cp build/rs README.md README.ru.md dist/package/
          tar -czf "dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz" -C dist/package .
          tar -xzf "dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz" -C dist/verify
          test -x dist/verify/rs
          dist/verify/rs --version
          file dist/verify/rs
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-linux-${{ matrix.arch }}
          path: dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (Clang)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-15
            arch: arm64
            machine: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure ripgrep comparison is available
        run: |
          if ! command -v rg >/dev/null; then
            brew install ripgrep
          fi
          rg --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test measurement harness
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Benchmark smoke (not a performance gate)
        run: |
          ./build/cs_bench --work perf-smoke --phase generate --files 64 --lines 12
          ./build/cs_bench --work perf-smoke --phase create --threads 2 --memory-mb 64
          ./build/cs_bench --work perf-smoke --phase search --memory-mb 64 --repeats 3 --stages 1
          ./build/cs_bench --work perf-smoke --phase create --index fast --profile fast --threads 2 --memory-mb 64
          ./build/cs_bench --work perf-smoke --phase search --index fast --memory-mb 64 --repeats 3 --stages 1
          python scripts/perf_benchmark.py --executable build/rs --index perf-smoke/index --corpus perf-smoke/source --iterations 3 --memory-mb 64 --query literal --query broad_regex --query no_match --rg rg --output perf-smoke/measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: perf-macos-${{ matrix.arch }}
          path: perf-smoke/measurements.json
      - name: Check whether native timing inputs changed
        id: native_perf
        shell: bash
        env:
          PREVIOUS_HEAD: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rerun=true
          # Documentation/raw-evidence updates still build and test every target,
          # but do not repeat a measured performance experiment on identical code.
          # Missing history or non-synchronize events conservatively run it.
          if [[ "$PREVIOUS_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            if git fetch --no-tags --depth=1 origin "$PREVIOUS_HEAD"; then
              if git diff --quiet "$PREVIOUS_HEAD" HEAD -- src include tests CMakeLists.txt cmake scripts .github/workflows bench ':(exclude)bench/results/**'; then
                rerun=false
              fi
            fi
          fi
          echo "run=$rerun" >> "$GITHUB_OUTPUT"
      - name: Check out original performance baseline
        if: steps.native_perf.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: eb858348169157686e70104af6b64f9539a39fe8
          path: native-baselines/original
          persist-credentials: false
      - name: Check out previous optimized checkpoint
        if: steps.native_perf.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: dbcddf76708b614c26e212fa27b48efa33ddfd58
          path: native-baselines/previous
          persist-credentials: false
      - name: Build native comparison binaries
        if: steps.native_perf.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          for revision in original previous; do
            cmake -S "native-baselines/$revision" -B "native-baselines/$revision/build" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DBUILD_TESTING=OFF
            cmake --build "native-baselines/$revision/build" --target researchify --parallel 3
            test "$(lipo -archs "native-baselines/$revision/build/rs")" = "${{ matrix.machine }}"
          done
          test "$(lipo -archs build/rs)" = "${{ matrix.machine }}"
      - name: Paired native performance comparisons (correctness gate only)
        if: steps.native_perf.outputs.run == 'true'
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python scripts/native_comparison.py \
            --original native-baselines/original/build/rs --original-checkout native-baselines/original \
            --previous native-baselines/previous/build/rs --previous-checkout native-baselines/previous \
            --current build/rs --current-checkout . --generator build/cs_bench \
            --machine "${{ matrix.machine }}" --files 20000 --iterations 21 --term-iterations 201 \
            --rg rg --output-dir native-perf
      - name: Preserve native comparison evidence, including failed/incomplete runs
        if: always() && steps.native_perf.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-macos-${{ matrix.arch }}
          path: native-perf/results/
          if-no-files-found: warn
      - name: Verify architecture, smoke-test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          ./build/rs --help
          ./build/rs --version
          test "$(lipo -archs build/rs)" = "${{ matrix.machine }}"
          mkdir -p dist/package dist/verify
          cp build/rs README.md README.ru.md dist/package/
          tar -czf "dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz" -C dist/package .
          tar -xzf "dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz" -C dist/verify
          test -x dist/verify/rs
          dist/verify/rs --version
          file dist/verify/rs
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-macos-${{ matrix.arch }}
          path: dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  clang:
    name: Linux x64 (Clang)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address/UB sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRESEARCHIFY_SANITIZERS=ON -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  preview:
    name: Publish tested multi-platform preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux, macos, clang, sanitizers]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: researchify-*
          path: dist
          merge-multiple: true
      - name: Verify all five archives and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archives=(
            ReSearchify-Windows-x64.zip
            ReSearchify-Linux-x64.tar.gz
            ReSearchify-Linux-arm64.tar.gz
            ReSearchify-macOS-x64.tar.gz
            ReSearchify-macOS-arm64.tar.gz
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create or update GitHub preview release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_SHA:0:12}"
          notes="Portable CLI builds for Windows x64, Linux x64/arm64 and macOS Intel/Apple Silicon. All five native builds and test suites plus Linux sanitizers passed for this commit. Verify your download against SHA256SUMS.txt before extracting. macOS binaries are not Apple-notarized."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ReSearchify-*.zip dist/ReSearchify-*.tar.gz dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title "ReSearchify preview (${GITHUB_SHA:0:7})" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/ReSearchify-*.zip dist/ReSearchify-*.tar.gz dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "ReSearchify preview (${GITHUB_SHA:0:7})" --notes "$notes"
          fi
