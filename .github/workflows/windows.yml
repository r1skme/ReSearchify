name: Build, test and publish previews

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DRESEARCHIFY_STATIC_RUNTIME=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Quick start check
        shell: pwsh
        run: |
          .\build\Release\rs.exe --help
          .\build\Release\rs.exe --version
      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item build/Release/rs.exe dist/package/rs.exe
          Copy-Item README.md, README.ru.md, LICENSE, SOURCE.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/ReSearchify-Windows-x64.zip -Force
          if (!(Test-Path dist/ReSearchify-Windows-x64.zip)) { throw 'Portable archive missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-windows-portable
          path: dist/ReSearchify-Windows-x64.zip
          if-no-files-found: error


  linux:
    name: Linux ${{ matrix.arch }} (GCC)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            machine: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRESEARCHIFY_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify architecture, smoke-test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          ./build/rs --help
          ./build/rs --version
          mkdir -p dist/package dist/verify
          cp build/rs README.md README.ru.md LICENSE SOURCE.md dist/package/
          tar -czf "dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz" -C dist/package .
          tar -xzf "dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz" -C dist/verify
          test -x dist/verify/rs
          dist/verify/rs --version
          file dist/verify/rs
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-linux-${{ matrix.arch }}
          path: dist/ReSearchify-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (Clang)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            machine: x86_64
          - os: macos-15
            arch: arm64
            machine: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DBUILD_TESTING=ON -DRESEARCHIFY_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify architecture, smoke-test and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          ./build/rs --help
          ./build/rs --version
          test "$(lipo -archs build/rs)" = "${{ matrix.machine }}"
          mkdir -p dist/package dist/verify
          cp build/rs README.md README.ru.md LICENSE SOURCE.md dist/package/
          tar -czf "dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz" -C dist/package .
          tar -xzf "dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz" -C dist/verify
          test -x dist/verify/rs
          dist/verify/rs --version
          file dist/verify/rs
      - uses: actions/upload-artifact@v4
        with:
          name: researchify-macos-${{ matrix.arch }}
          path: dist/ReSearchify-macOS-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  sanitizers:
    name: Address/UB sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRESEARCHIFY_SANITIZERS=ON -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure

  preview:
    name: Publish tested multi-platform preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, linux, macos, sanitizers]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: researchify-*
          path: dist
          merge-multiple: true
      - name: Verify all five archives and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archives=(
            ReSearchify-Windows-x64.zip
            ReSearchify-Linux-x64.tar.gz
            ReSearchify-Linux-arm64.tar.gz
            ReSearchify-macOS-x64.tar.gz
            ReSearchify-macOS-arm64.tar.gz
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create or update GitHub preview release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="preview-${GITHUB_SHA:0:12}"
          notes="Portable CLI builds for Windows x64, Linux x64/arm64 and macOS Intel/Apple Silicon. All five native builds and test suites plus Linux sanitizers passed for this commit. Verify your download against SHA256SUMS.txt before extracting. macOS binaries are not Apple-notarized. License: GNU GPLv3 only; corresponding source is available as the source archive for this release tag."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/ReSearchify-*.zip dist/ReSearchify-*.tar.gz dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title "ReSearchify preview (${GITHUB_SHA:0:7})" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/ReSearchify-*.zip dist/ReSearchify-*.tar.gz dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "ReSearchify preview (${GITHUB_SHA:0:7})" --notes "$notes"
          fi
