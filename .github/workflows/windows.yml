name: MSVC and portable C++20
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Benchmark smoke test
        run: .\build\Release\cs_bench.exe --work .\bench-smoke --files 300 --lines 50 --threads 4 --memory-mb 128 --repeats 3
  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRESEARCHIFY_SANITIZERS=ON
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
